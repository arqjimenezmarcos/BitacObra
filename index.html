<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16213A"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BitacObra"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BitacObra · Bitácora de campo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0F0EE;--bg2:#FFFFFF;--tint:#F5F5F3;--fg:#1B2430;--mut:#5E6773;--acc:#1D4ED8;--accf:#fff;--line:#E1E2DE;--sig:#F26A21;--hd:#16213A;--cd:'Barlow Condensed','Arial Narrow',sans-serif}
[data-theme=dark]{--bg:#12161C;--bg2:#1B2129;--tint:#161C24;--fg:#E8EAEE;--mut:#98A1AD;--acc:#6EA0FF;--accf:#10151C;--line:#2B333E;--hd:#0C1016}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:400 16px/1.5 Barlow,system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;padding-bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))}
.in{max-width:800px;margin:0 auto;padding:0 1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--hd);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:.7rem;padding-top:.7rem}
.brand{display:flex;align-items:center;gap:.65rem;flex:1}.lg{width:40px;height:40px;flex:none}
h1{font:700 1.7rem/1 var(--cd);letter-spacing:.02em}h1 small{display:block;font:400 .8rem/1.3 Barlow;opacity:.7;letter-spacing:0}
.ib{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:none;color:#fff;font-size:1.15rem;cursor:pointer}
.obr{padding:.6rem 0 .75rem}.obr{display:flex;gap:.5rem;align-items:center}.obr select{flex:1}.obr option{color:#000}.obr select,.obr input{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.25);color:#fff;margin:0;padding:.5rem .8rem}.obr input::placeholder{color:rgba(255,255,255,.6)}
.tape{height:6px;background:repeating-linear-gradient(-45deg,var(--sig) 0 10px,#111 10px 20px)}
main{padding-top:1.2rem}
h2{font:700 2.1rem/1.05 var(--cd);margin:.5rem 0 .3rem}
.mut,small{color:var(--mut)}
.fol{display:inline-block;border:2px solid var(--sig);color:var(--sig);border-radius:4px;padding:.05rem .6rem;font:700 1.35rem/1.3 var(--cd);letter-spacing:.05em;transform:rotate(-2deg)}
.hoja{background:var(--bg2);border-radius:10px;margin:1.2rem 0;box-shadow:0 1px 2px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.06)}
.hh{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.55rem .9rem;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;font:600 1.25rem/1.2 var(--cd)}
.hh span+span{font:500 .9rem Barlow;color:var(--mut)}
.hb{padding:1rem 1.1rem}.hb>p+p{margin-top:.3rem}
label{display:block;font-weight:500;font-size:.92rem;color:var(--mut);margin-top:.75rem}
input,select,textarea{width:100%;min-height:50px;padding:.75rem .9rem;background:var(--bg);border:1.5px solid var(--line);border-radius:4px;margin-top:.25rem;color:var(--fg);font-size:1rem}
textarea{min-height:110px;resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=checkbox]{width:28px;height:28px;min-height:0;margin:0;accent-color:var(--acc);flex:none}
.btn{display:block;width:100%;min-height:52px;padding:.95rem;margin-top:.9rem;background:var(--acc);color:var(--accf);border:1.5px solid var(--acc);border-radius:4px;font-weight:600;font-size:1.05rem;cursor:pointer;text-align:center}
.btn:active{transform:translateY(1px);opacity:.85}.btn.g{background:none;color:var(--acc)}.btn.sm{display:inline-block;width:auto;padding:.4rem .9rem;margin:.5rem .4rem 0 0;font-size:.92rem}
.x{background:none;border:0;color:var(--mut);font-size:1.1rem;cursor:pointer;padding:.3rem .5rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.35rem}
.ch{padding:.8rem 1.2rem;border:1.5px solid var(--line);background:var(--bg);border-radius:4px;font-weight:500;cursor:pointer}.ch.on{background:var(--acc);color:var(--accf);border-color:var(--acc)}
.tag{display:inline-block;background:var(--tint);border:1px solid var(--line);border-radius:4px;padding:.15rem .6rem;margin:0 .4rem .4rem 0;font-weight:500}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.7rem;margin-top:.7rem}
.ph figure{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--bg)}.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.ph input{margin:0;border:0;border-top:1px solid var(--line);border-radius:0;font-size:.88rem;padding:.4rem .5rem}
.ph .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:28px;height:28px;padding:0}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:.2rem .7rem;padding:.75rem .9rem;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.fl{flex:1 1 150px;display:flex;flex-direction:column}.tc{text-decoration:line-through;opacity:.55}
.av{width:40px;height:40px;border-radius:4px;background:var(--acc);color:var(--accf);display:grid;place-items:center;font:700 1.3rem var(--cd)}
.sw{display:flex;align-items:center;gap:.4rem;margin:0;color:var(--fg);cursor:pointer}
.cl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.g2 .btn{margin-top:0}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav .in{display:flex;padding:0}
nav button{flex:1;position:relative;background:none;border:0;padding:.7rem .2rem .6rem;cursor:pointer;color:var(--mut);font-weight:500;font-size:.76rem;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--acc);font-weight:600;box-shadow:inset 0 3px var(--acc)}
nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bd{position:absolute;top:5px;left:calc(50% + 6px);background:var(--sig);color:#fff;font:600 .7rem/1 Barlow;border-radius:99px;padding:3px 6px;font-style:normal}
dialog{border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:6px;background:var(--bg2);color:var(--fg);width:min(94vw,520px);max-height:88vh;overflow:auto;margin:auto;padding:0}
dialog::backdrop{background:rgba(8,12,18,.65)}
table{width:100%;border-collapse:collapse;margin-top:.6rem}th,td{text-align:right;padding:.4rem .3rem;border-bottom:1px solid var(--line);font-size:.92rem}th:first-child,td:first-child{text-align:left}
#ts{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:.6rem 1.1rem;border-radius:4px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:30}#ts.on{opacity:1;transform:translate(-50%,0)}
/* Documento del reporte (pantalla e impresión) */
#rp{display:none}
.doc{background:#fff;color:#16213A;padding:1rem;font-size:13px;line-height:1.45}
.dh{display:flex;align-items:center;gap:.7rem;border-bottom:3px solid #16213A;padding-bottom:.6rem}.dh>div:nth-child(2){flex:1}.dh b{display:block;font:700 1.5rem/1 var(--cd)}.dh span{color:#444}
.fo{text-align:right}.fo b{color:#F26A21;font-size:1.6rem}.fo small{display:block;color:#555}
.dm{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.6rem;padding:.6rem 0;border-bottom:1px solid #bbb}.dm small{display:block;color:#555}
.doc h4{font:700 1.15rem var(--cd);margin:.9rem 0 .2rem;border-bottom:1px solid #16213A}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.fg figure{break-inside:avoid;border:1px solid #bbb}.fg img{display:block;width:100%;max-height:75mm;object-fit:contain;background:#f2f2f2}.fg figcaption{padding:.25rem .4rem;font-size:11px;border-top:1px solid #bbb}
.fm{margin:2.5rem auto 0;width:60%;text-align:center;break-inside:avoid}.fm i{display:block;border-top:1.5px solid #16213A;margin-bottom:.2rem}
dialog[open]{animation:up .25s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(max-width:600px){dialog{margin:auto auto 0;width:100%;max-width:none;border-radius:14px 14px 0 0}}
@media(prefers-reduced-motion:reduce){dialog[open]{animation:none}}
.vac{text-align:center;padding:2rem 1rem;color:var(--mut)}.vac svg{margin-bottom:.6rem}.ph img{cursor:zoom-in}
.dh{border-bottom:1px solid #D5D8DE;padding-bottom:.8rem}.dh>div.dt{flex:1 1 auto}.dt b{font-size:1.7rem}.dl{max-height:46px;max-width:120px;object-fit:contain}
.dm{border-bottom:1px solid #D5D8DE;padding:.8rem 0}
.doc h4{font:600 1rem var(--cd);color:#1D4ED8;border-bottom:1px solid #D5D8DE;margin:1.1rem 0 .3rem;padding-bottom:.15rem}
.fg figure{border:0}.fg img{border-radius:3px}.fg figcaption{border:0;padding:.25rem 0}
.dw{width:100%;border-collapse:collapse}.dw td{padding:0}.dw tfoot{display:table-footer-group}.pf{padding-top:3mm!important;border-top:1px solid #D5D8DE;text-align:center;font-size:10px;color:#777}
select.js{width:auto;min-width:150px;margin:0}.stk{font:700 1.3rem var(--cd)}.stk.lo{color:var(--sig)}.alerta{background:rgba(242,106,33,.12);border-left:4px solid var(--sig);padding:.8rem 1rem;border-radius:6px;margin-top:1rem;font-weight:500}
/* PDF v3: sobrio, grises y crema */
.doc{color:#2B2F36}
.doc .dh{display:flex;align-items:center;gap:.8rem;border-bottom:1.5px solid #2B2F36;padding-bottom:.7rem}.doc .dt{flex:1}.doc .dt b{display:block;font:700 1.55rem/1.1 var(--cd);letter-spacing:.03em;text-transform:uppercase;color:#2B2F36}
.doc .fo{text-align:right;border:0;padding:0}.doc .fo small{display:block;font:500 .7rem Barlow;letter-spacing:.12em;text-transform:uppercase;color:#7A7F87}.doc .fo b{display:block;font:700 1.5rem/1.1 var(--cd);color:#2B2F36}
.doc .dg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1.4rem;padding:.7rem 0;border-bottom:1px solid #DAD7CF}.doc .dg small,.doc .gl small{display:block;font:500 .68rem Barlow;letter-spacing:.1em;text-transform:uppercase;color:#7A7F87}.doc .dg b{font-weight:600;color:#2B2F36}
.doc .gl{display:grid;grid-template-columns:repeat(4,1fr);background:#F6F4EE;border:1px solid #E6E3DA;border-radius:4px;padding:.65rem 0;margin:.8rem 0 .3rem;break-inside:avoid}.doc .gl>div{text-align:center;border-right:1px solid #E6E3DA}.doc .gl>div:last-child{border:0}.doc .gl b{display:block;font:600 1.3rem/1.15 var(--cd);color:#2B2F36}.doc .gl .al b{color:#8A5A1F}.doc .gl .ok b{color:#2B2F36}
.doc .bk{margin-top:.8rem;border:1px solid #E6E3DA;border-radius:4px;overflow:hidden}.doc .bk h4{display:flex;align-items:center;gap:.5rem;margin:0;padding:.35rem .75rem;background:#F6F4EE;color:#2B2F36;font:600 .9rem var(--cd);letter-spacing:.08em;text-transform:uppercase;border:0;border-bottom:1px solid #E6E3DA}
.doc .bk h4 i{font-style:normal;color:#7A7F87;font-weight:600}.doc .bk h4 em{margin-left:auto;font:500 .7rem Barlow;letter-spacing:.08em;color:#8A5A1F}
.doc .bb{padding:.55rem .8rem;background:#fff}.doc .bb p{color:#2B2F36}.doc .alr{border-color:#D9C9A8;border-left:3px solid #B58A3C}.doc .alr h4{background:#FBF5E6;border-bottom-color:#EADFC4}.doc .alr .bb{background:#FDFAF1}
.doc .bk>.fg{padding:.6rem .7rem}.doc .fg{gap:.7rem}.doc .fg figure{border:1px solid #E6E3DA;border-radius:3px;overflow:hidden;break-inside:avoid;background:#fff}.doc .fg img{height:220px;max-height:none;width:100%;object-fit:contain;background:#F6F4EE;border-radius:0}.doc .fg figcaption{padding:.3rem .5rem;border-top:1px solid #E6E3DA;font-size:11px;color:#5E6773}
.doc .fr{display:flex;gap:3rem;margin-top:2.8rem;break-inside:avoid}.doc .fm{flex:1;width:auto;margin:0;text-align:center}.doc .fm i{border-top:1px solid #2B2F36}.doc .fm b{display:block;font-weight:600;font-size:12px}.doc .fm small{color:#7A7F87;font-size:11px}
.pf{border-top:1px solid #E6E3DA!important;color:#9AA0A8!important}
@page{size:A4;margin:13mm 14mm 14mm}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body>*:not(#rp){display:none!important}body{background:#fff;padding:0}#rp{display:block}.doc{padding:0}}
</style>
</head>
<body>
<header>
  <div class="in top">
    <div class="brand" id="lg"></div>
    <button class="ib" id="ins" hidden style="width:auto;padding:0 .9rem;border-radius:99px;font-size:.9rem;font-weight:600">Instalar</button>
    <button class="ib" id="th" aria-label="Cambiar entre modo claro y oscuro">◐</button>
  </div>
  <div class="in obr"><select id="ps" aria-label="Obra activa"></select><button class="ib" data-a="nobra" aria-label="Nueva obra">＋</button><button class="ib" data-a="ajustes" aria-label="Ajustes">⚙</button></div>
  <div class="tape"></div>
</header>
<main id="app" class="in"></main>
<nav id="nav"><div class="in"></div></nav>
<dialog id="sh"></dialog>
<div id="rp"></div>
<div id="ts" role="status"></div>

<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},set=(k,x)=>{try{localStorage.setItem(k,x)}catch(e){}};
const z=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()),hoy=()=>ymd(new Date()),pad=n=>String(n).padStart(4,'0');
const fd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'})},fs=s=>s.split('-').reverse().join('/');
const money=n=>'$'+(Math.round(n*100)/100).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2});
const wk=s=>{const[y,m,d]=s.split('-').map(Number),dw=(new Date(y,m-1,d).getDay()+6)%7;return[0,1,2,3,4,5,6].map(i=>ymd(new Date(y,m-1,d-dw+i)))};
const logo=(a,b)=>`<svg class="lg" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="7" fill="${a}"/><path d="M24 6v6" stroke="${b}" stroke-width="3" stroke-linecap="round"/><rect x="7" y="17" width="34" height="14" rx="7" fill="none" stroke="${b}" stroke-width="3"/><path d="M17 20.5v7M31 20.5v7" stroke="${b}" stroke-width="2" stroke-linecap="round"/><circle cx="24" cy="24" r="3.6" fill="${b}"/><path d="M7 39h34M7 39v-3M15 39v-2M24 39v-3M33 39v-2M41 39v-3" stroke="${b}" stroke-width="2" stroke-linecap="round"/></svg>`;
$('#lg').innerHTML=logo('var(--acc)','var(--accf)')+'<h1>BitacObra<small>Bitácora de campo</small></h1>';

/* Datos: se guardan en IndexedDB (aguanta muchas fotos) */
let S={cur:'p1',P:{},emp:'',lgo:'',inv:[],obra:'',ubic:'',pers:[],rep:[],pen:[],asi:{},ade:[],n:0,f:{fecha:hoy(),clima:'Soleado',act:'',inc:'',fotos:[]}};
const idb=new Promise(r=>{try{const q=indexedDB.open('bitacobra',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const dbio=async(m,v)=>{const d=await idb;if(!d)return;return new Promise(r=>{const o=d.transaction('s',m=='get'?'readonly':'readwrite').objectStore('s'),q=m=='get'?o.get('S'):o.put(v,'S');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
let tm;const save=()=>{clearTimeout(tm);tm=setTimeout(()=>dbio('put',S),250)};

let dk=get('bo_t')?get('bo_t')=='d':matchMedia('(prefers-color-scheme:dark)').matches;
const theme=()=>{document.documentElement.dataset.theme=dk?'dark':'light';set('bo_t',dk?'d':'l');$('meta[name=theme-color]').content=dk?'#0C1016':'#16213A'};
theme();$('#th').onclick=()=>{dk=!dk;theme()};

const toast=m=>{const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2300)};
const sh=$('#sh');sh.addEventListener('click',e=>{if(e.target===sh)sh.close()});
const sheet=h=>{sh.innerHTML=h;if(!sh.open)sh.showModal()};
const form=(t,fl,ok,btn)=>{sheet(`<div class="hh"><span>${t}</span><button class="x" data-c aria-label="Cerrar">✕</button></div><div class="hb">${fl.map(([k,l,ty,ph])=>`<label>${l}<input id="q_${k}" type="${ty||'text'}" ${ty=='number'?'inputmode="decimal" step="any" min="0"':''} placeholder="${ph||''}"></label>`).join('')}<button class="btn" id="qok">${btn||'Guardar'}</button></div>`);
  $('#qok').onclick=()=>{const v={};fl.forEach(([k])=>v[k]=$('#q_'+k).value.trim());if(ok(v)!==false)sh.close()};const i=sh.querySelector('input');if(i)i.focus()};
const comp=(f,M=1200,T='image/jpeg')=>new Promise(res=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL(T,.75))};im.onerror=()=>{URL.revokeObjectURL(u);res(null)};im.src=u});

const CAMPOS=['obra','ubic','pers','rep','pen','asi','ade','n','f','inv'],blank=()=>({obra:'',ubic:'',pers:[],rep:[],pen:[],asi:{},ade:[],inv:[],n:0,f:{fecha:hoy(),clima:'Soleado',act:'',inc:'',fotos:[]}}),snap=()=>Object.fromEntries(CAMPOS.map(k=>[k,S[k]]));
const hdr=()=>{$('#ps').innerHTML=[[S.cur,S.obra],...Object.entries(S.P).map(([k,v])=>[k,v.obra])].map(([k,n])=>`<option value="${k}"${k==S.cur?' selected':''}>${E(n||'Obra sin nombre')}</option>`).join('')};
const cambiar=id=>{if(id==S.cur||!S.P[id])return;S.P[S.cur]=snap();const n=S.P[id];delete S.P[id];CAMPOS.forEach(k=>S[k]=n[k]);S.cur=id;save();hdr();render();scrollTo(0,0)};
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
const gaj=()=>{S.obra=$('#s_ob').value.trim();S.ubic=$('#s_ub').value.trim();S.emp=$('#s_em').value.trim();save()};
const ajustes=()=>{sheet(`<div class="hh"><span>Ajustes</span><button class="x" data-c aria-label="Cerrar">✕</button></div><div class="hb"><label>Nombre de la obra<input id="s_ob" value="${E(S.obra)}"></label><label>Ubicación de la obra (sale en el PDF)<input id="s_ub" placeholder="Ej.: Av. Principal #123, Ciudad" value="${E(S.ubic||'')}"></label><label>Empresa contratista (sale en el PDF)<input id="s_em" value="${E(S.emp||'')}"></label><label>Logo de la empresa (opcional)<input type="file" id="s_lg" accept="image/*"></label>${S.lgo?`<img src="${S.lgo}" alt="Logo" style="max-height:48px;margin-top:.6rem"><button class="btn g sm" data-a="lgx">Quitar logo</button>`:''}<button class="btn" id="s_ok">Guardar ajustes</button><button class="btn g" data-a="resp">Respaldar datos</button><label class="btn g" style="cursor:pointer;color:var(--acc);font-size:1.05rem;margin-top:.9rem">Restaurar respaldo<input type="file" id="s_rs" accept=".json" hidden></label><button class="btn g" data-a="csv">Exportar nómina de la semana (CSV)</button><button class="btn g" data-a="eobra" style="color:#C0392B">Eliminar esta obra</button></div>`);$('#s_ok').onclick=()=>{gaj();sh.close();hdr();render()}};
const rest=f=>{if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.pers||!d.rep)throw 0;if(!confirm('Esto reemplaza todos los datos actuales por los del respaldo. ¿Continuar?'))return;S=Object.assign(S,d);migAll();save();sh.close();hdr();render();toast('Respaldo restaurado')}catch(e){toast('El archivo no es un respaldo válido de BitacObra')}};r.readAsText(f)};
const CLIMA={'Soleado':'☀','Nublado':'☁','Lluvia':'☂'};

<button class="btn" data-a="guardar">Guardar reporte</button>`};

const vCuad=()=>{const f=S.f.fecha,pr=presentes(f),w=wk(f);return`<h2>Cuadrilla</h2><p class="mut">Asistencia, adelantos y pago de la semana.</p>

const vPen=()=>{const ab=S.pen.filter(x=>!x.d),ce=S.pen.filter(x=>x.d),it=x=>`<div class="row"><input type="checkbox" data-a="tp" data-i="${x.id}"${x.d?' checked':''} aria-label="Marcar corregido"><div class="fl"><span${x.d?' class="tc"':''}>${E(x.t)}</span><small>${E(x.r||'Sin asignar')} · ${fs(x.f)}</small></div><button class="x" data-a="dp" data-i="${x.id}" aria-label="Eliminar">✕</button></div>`;
return`<h2>Pendientes</h2><p class="mut">Detalles por corregir antes de entregar la obra.</p>
<section class="hoja"><div class="hh"><span>Nuevo pendiente</span></div><div class="hb"><input id="pt" placeholder="Ej.: Pintar mancha en el pasillo"><label>Responsable<select id="pr"><option value="">Sin asignar</option>${S.pers.map(p=>`<option>${E(p.n)}</option>`).join('')}</select></label><button class="btn" data-a="ap">Agregar pendiente</button></div></section>
<section class="hoja"><div class="hh"><span>Por resolver</span><span>${ab.length}</span></div>${ab.map(it).join('')||'<p class="hb mut">No hay pendientes abiertos.</p>'}</section>${ce.length?`<section class="hoja"><div class="hh"><span>Corregidos</span><span>${ce.length}</span></div>${ce.map(it).join('')}</section>`:''}`};

let Q='',QF='';
const rcard=r=>`<section class="hoja"><div class="hh"><span>N° ${pad(r.n)}</span><span>${fs(r.fecha)}</span></div><div class="hb"><p><b>${E(r.obra||'Obra sin nombre')}</b> · ${E(r.clima)}</p><p class="mut cl">${E(r.act||r.inc||'Solo registro fotográfico')}</p><small>${r.fotos.length} fotos · ${r.pers.length} personas${r.inc?' · con incidentes':''}</small><div><button class="btn sm" data-a="pdf" data-i="${r.id}">Exportar PDF</button><button class="btn g sm" data-a="share" data-i="${r.id}">Compartir</button><button class="btn g sm" data-a="ver" data-i="${r.id}">Ver</button><button class="btn g sm" data-a="dr" data-i="${r.id}">Eliminar</button></div></div></section>`;
const rlist=()=>{const q=Q.toLowerCase(),L=S.rep.filter(r=>(!q||(r.act+' '+r.inc+' '+r.fecha+' '+r.clima).toLowerCase().includes(q))&&(QF=='inc'?r.inc:QF=='ll'?r.clima=='Lluvia':1));return L.map(rcard).join('')||`<div class="vac"><svg width="76" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 42a22 22 0 0 1 44 0z"/><path d="M6 46h52M28 20v22M36 20v22"/></svg><p>${S.rep.length?'Ningún reporte coincide con la búsqueda.':'Aún no hay reportes. Llena la bitácora y toca «Guardar reporte».'}</p></div>`};
const vRep=()=>`<h2>Reportes</h2><p class="mut">Cada reporte guardado se puede ver, compartir y exportar a PDF con sus fotos a color.</p><input id="rq" type="search" style="margin-top:1rem" placeholder="Buscar por fecha o palabra…" value="${E(Q)}" aria-label="Buscar reportes"><div class="chips" style="margin-bottom:.4rem"><button class="ch${QF=='inc'?' on':''}" data-a="rf" data-i="inc">Con incidentes</button><button class="ch${QF=='ll'?' on':''}" data-a="rf" data-i="ll">Lluvia</button></div><div id="rl">${rlist()}</div>`;

const doc=r=>{const nl=t=>E(t).replace(/\n/g,'<br>'),inc=!!r.inc,np=r.pers.length,nf=r.fotos.length;return`<div class="doc"><table class="dw"><tbody><tr><td>
<div class="dh">${S.lgo?`<img class="dl" src="${S.lgo}" alt="">`:''}<div class="dt"><b>Reporte diario de obra</b></div><div class="fo"><small>Folio</small><b>N° ${pad(r.n)}</b></div></div>
<div class="dg"><div><small>Proyecto</small><b>${E(r.obra||'Obra sin nombre')}</b></div><div><small>Ubicación</small><b>${E(r.ubic||S.ubic||'—')}</b></div><div><small>Contratista</small><b>${E(S.emp||'—')}</b></div><div><small>Fecha</small><b>${E(fd(r.fecha))}</b></div></div>
<div class="gl"><div><b>${np}</b><small>Personal en obra</small></div><div><b>${E(r.clima)}</b><small>Clima</small></div><div><b>${nf}</b><small>Fotos</small></div><div class="${inc?'al':'ok'}"><b>${inc?'Sí':'No'}</b><small>Incidentes</small></div></div>

<section class="bk${inc?' alr':''}"><h4><i>2.</i>Incidentes o retrasos${inc?'<em>Requiere atención</em>':''}</h4><div class="bb"><p>${nl(r.inc||'Ninguno')}</p></div></section>
<section class="bk"><h4><i>3.</i>Personal en obra (${np})</h4><div class="bb"><p>${np?r.pers.map(E).join(' · '):'Sin registro'}</p></div></section>
${nf?`<section class="bk"><h4><i>4.</i>Registro fotográfico (${nf})</h4><div class="fg">${r.fotos.map((p,i)=>`<figure><img src="${p.u}" alt=""><figcaption><b>Foto ${i+1}</b>${p.c?' · '+E(p.c):''}</figcaption></figure>`).join('')}</div></section>`:''}
<div class="fr"><div class="fm"><i></i><b>Residente de obra</b><small>Elaboró · Nombre y firma</small></div><div class="fm"><i></i><b>Supervisor</b><small>Revisó · Nombre y firma</small></div></div></td></tr></tbody><tfoot><tr><td class="pf">© BitacObra</td></tr></tfoot></table></div>`};

const mig=o=>{o.inv=o.inv||[];for(const f in o.asi||{})if(Array.isArray(o.asi[f])){const m={};o.asi[f].forEach(id=>m[id]=1);o.asi[f]=m}},migAll=()=>{mig(S);Object.values(S.P||{}).forEach(mig)};
const fq=n=>Math.round(n*100)/100;
const vInv=()=>{const bj=S.inv.filter(m=>m.s<=m.min);return`<h2>Materiales</h2><p class="mut">Controla lo que llega a la obra y lo que se consume.</p><button class="btn" style="margin-top:1rem" data-a="ainv">Agregar material</button>${bj.length?`<div class="alerta">Stock bajo: ${bj.map(m=>E(m.m)).join(', ')}</div>`:''}
<section class="hoja"><div class="hh"><span>Inventario</span><span>${S.inv.length} materiales</span></div>${S.inv.map(m=>{const u=m.mv[0];return`<div class="row"><div class="fl"><b>${E(m.m)}</b><small>Mínimo ${fq(m.min)} ${E(m.u)}${u?` · último: ${u.t=='in'?'+':'−'}${fq(u.q)} el ${fs(u.d)}`:''}</small></div><span class="stk${m.s<=m.min?' lo':''}">${fq(m.s)} ${E(m.u)}</span><div style="flex-basis:100%"><button class="btn sm" data-a="rec" data-i="${m.id}">Recibir</button><button class="btn g sm" data-a="con" data-i="${m.id}">Consumo</button><button class="btn g sm" data-a="hinv" data-i="${m.id}">Historial</button><button class="x" data-a="dinv" data-i="${m.id}" aria-label="Eliminar ${E(m.m)}">✕</button></div></div>`}).join('')||'<p class="hb mut">Agrega cemento, cabillas, bloques… y registra cada entrega y cada consumo.</p>'}</section>`};
const NAV=[['diario','Diario','<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'],['rep','Reportes','<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>'],['cuadrilla','Cuadrilla','<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>'],['inv','Materiales','<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'],['pen','Pendientes','<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>']];
let view='diario';
function render(){const n=S.pen.filter(x=>!x.d).length,bj=S.inv.filter(m=>m.s<=m.min).length;$('#app').innerHTML=({diario:vDiario,rep:vRep,cuadrilla:vCuad,inv:vInv,pen:vPen})[view]();
  $('#nav .in').innerHTML=NAV.map(([k,l,p])=>`<button data-a="nav" data-i="${k}"${view==k?' class="on" aria-current="page"':''}><svg viewBox="0 0 24 24">${p}</svg>${l}${(k=='pen'?n:k=='inv'?bj:0)?`<i class="bd">${k=='pen'?n:bj}</i>`:''}</button>`).join('')}

const num=v=>parseFloat(String(v).replace(',','.'));
const mov=(i,t)=>{const m=S.inv.find(x=>x.id==i);form((t=='in'?'Recibir ':'Consumo de ')+m.m,[['q','Cantidad ('+m.u+')','number','0'],['n',t=='in'?'Proveedor o guía (opcional)':'Dónde se usó (opcional)']],v=>{const q=num(v.q);if(!(q>0)){toast('Escribe una cantidad mayor a cero');return false}if(t=='out'&&q>m.s){toast('Solo quedan '+fq(m.s)+' '+m.u);return false}m.s=fq(m.s+(t=='in'?q:-q));m.mv.unshift({d:hoy(),t,q,n:v.n});save();toast(t=='in'?'Entrada registrada':'Consumo registrado');render()},'Registrar')};
const A={

eobra:()=>{const ks=Object.keys(S.P),nm=S.obra||'Obra sin nombre';if(!confirm('¿Eliminar la obra «'+nm+'» con sus '+S.rep.length+' reportes, cuadrilla, materiales y pendientes? No se puede deshacer.'))return;if(ks.length){const id=ks[0],n=S.P[id];delete S.P[id];CAMPOS.forEach(k=>S[k]=n[k]);S.cur=id}else{const b=blank();CAMPOS.forEach(k=>S[k]=b[k])}save();sh.close();hdr();render();toast('Obra «'+nm+'» eliminada')},

lgx:()=>{gaj();S.lgo='';save();ajustes()},

csv:()=>{const w=wk(S.f.fecha),L=[['Obrero','Cargo','Días','Pago diario','Adelantos','A pagar']];S.pers.forEach(p=>{const d=w.reduce((t,x)=>t+jor(x,p.id),0),ad=S.ade.filter(q=>q.p==p.id&&w.includes(q.d)).reduce((t,q)=>t+q.m,0);L.push([p.n,p.r,d,p.t,ad,d*p.t-ad])});dl(new Blob(['\ufeff'+L.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\r\n')],{type:'text/csv'}),'nomina-'+w[0]+'.csv')},
mic:i=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Tu navegador no admite dictado por voz');const r=new R();r.lang='es-VE';r.onresult=e=>{S.f[i]=(S.f[i]?S.f[i]+' ':'')+e.results[0][0].transcript;save();render()};r.onerror=()=>toast('No se pudo dictar. Revisa el permiso del micrófono');r.start();toast('Escuchando… habla ahora')},
zoom:i=>sheet(`<div style="background:#000;padding:.6rem"><button class="x" data-c style="color:#fff;float:right;font-size:1.4rem" aria-label="Cerrar">✕</button><img src="${S.f.fotos[i].u}" alt="" style="width:100%;display:block;margin-top:2rem"></div>`),

nav:i=>{view=i;render();scrollTo(0,0)},
clima:i=>{S.f.clima=i;save();render()},
foto:()=>$('#fi').click(),
fx:i=>{S.f.fotos.splice(i,1);save();render()},
guardar:()=>{const f=S.f;if(!f.act.trim()&&!f.inc.trim()&&!f.fotos.length)return toast('Escribe las actividades o adjunta una foto');S.n++;S.rep.unshift({id:uid(),n:S.n,fecha:f.fecha,clima:f.clima,act:f.act.trim(),inc:f.inc.trim(),fotos:f.fotos,pers:presentes(f.fecha).map(p=>p.n+(p.r?' ('+p.r+')':'')+(jor(f.fecha,p.id)!=1?' · '+jor(f.fecha,p.id)+' día':'')),obra:S.obra,ubic:S.ubic||'',t:Date.now()});toast('Reporte N° '+pad(S.n)+' guardado');S.f={fecha:hoy(),clima:f.clima,act:'',inc:'',fotos:[]};save();A.nav('rep')},
apers:()=>form('Agregar obrero',[['n','Nombre y apellido','text','Ej.: Juan Pérez'],['r','Cargo','text','Ej.: Maestro de obra'],['t','Pago diario (US$)','number','30']],v=>{if(!v.n){toast('Escribe el nombre');return false}S.pers.push({id:uid(),n:v.n,r:v.r,t:num(v.t)||0});save();toast(v.n+' agregado');render()}),
dpe:i=>{const p=S.pers.find(x=>x.id==i);if(p&&confirm('¿Quitar a '+p.n+' de la cuadrilla? Los reportes ya guardados no cambian.')){S.pers=S.pers.filter(x=>x.id!=i);save();render()}},
ad:i=>form('Adelanto',[['m','Monto (US$)','number','0.00']],v=>{const m=num(v.m);if(!(m>0)){toast('Escribe un monto mayor a cero');return false}S.ade.push({p:i,d:S.f.fecha,m});save();toast('Adelanto registrado');render()}),

  sheet(`<div class="hh"><span>Cálculo del sábado</span><button class="x" data-c aria-label="Cerrar">✕</button></div><div class="hb"><small>Semana del ${fs(w[0]).slice(0,5)} al ${fs(w[5]).slice(0,5)}: días asistidos × pago diario − adelantos</small>${S.pers.length?`<table><thead><tr><th>Obrero</th><th>Días</th><th>Pago</th><th>Adelantos</th><th>A pagar</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="4"><b>Total</b></td><td><b>${money(T)}</b></td></tr></tfoot></table>`:'<p class="mut" style="margin-top:.6rem">Agrega personal para calcular el pago.</p>'}<button class="btn g" data-c>Cerrar</button></div>`)},
ap:()=>{const t=$('#pt').value.trim();if(!t){toast('Escribe el pendiente');return $('#pt').focus()}S.pen.unshift({id:uid(),t,r:$('#pr').value,f:hoy(),d:0});save();render()},

dp:i=>{S.pen=S.pen.filter(x=>x.id!=i);save();render()},
ver:i=>sheet(`<div class="hb" style="padding:.4rem"><button class="x" data-c style="float:right" aria-label="Cerrar">✕</button>${doc(S.rep.find(r=>r.id==i))}<button class="btn" data-a="pdf" data-i="${i}">Exportar PDF</button></div>`),
pdf:i=>{const r=S.rep.find(x=>x.id==i),t0=document.title;sh.close();$('#rp').innerHTML=doc(r);document.title='BitacObra N° '+pad(r.n)+' - '+r.fecha;addEventListener('afterprint',()=>{document.title=t0;$('#rp').innerHTML=''},{once:true});setTimeout(()=>print(),150)},
dr:i=>{const r=S.rep.find(x=>x.id==i);if(confirm('¿Eliminar el reporte N° '+pad(r.n)+'? No se puede deshacer.')){S.rep=S.rep.filter(x=>x.id!=i);save();render()}}
};
document.addEventListener('click',e=>{if(e.target.closest('[data-c]'))return sh.close();const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i,b)});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='rq'){Q=t.value;$('#rl').innerHTML=rlist();return}if(t.dataset.m)S.f[t.dataset.m]=t.value;else if(t.dataset.fc!=null)S.f.fotos[t.dataset.fc].c=t.value;else if(t.id=='ob')S.obra=t.value;else return;save()});
document.addEventListener('change',async e=>{const t=e.target;if(t.id=='ps')cambiar(t.value);else if(t.id=='s_lg'){const f=t.files[0];if(f){gaj();const u=await comp(f,400,'image/png');if(u){S.lgo=u;save();ajustes()}}}else if(t.id=='s_rs')rest(t.files[0]);else if(t.dataset.as){const a=S.asi[S.f.fecha]||(S.asi[S.f.fecha]={});a[t.dataset.as]=num(t.value);save();render()}else if(t.id=='fe'){S.f.fecha=t.value||hoy();save();render()}
  else if(t.id=='fi'){const fl=[...t.files];t.value='';toast('Procesando fotos…');for(const f of fl){const u=await comp(f);if(u)S.f.fotos.push({u,c:''});else toast('No se pudo leer una de las imágenes')}save();render()}});

(async()=>{const d=await dbio('get');if(d){S=Object.assign(S,d);if(!S.f||!Array.isArray(S.f.fotos))S.f={fecha:hoy(),clima:'Soleado',act:'',inc:'',fotos:[]}}migAll();hdr();render()})();
let dip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#ins').hidden=false});
$('#ins').onclick=async()=>{if(!dip)return;dip.prompt();await dip.userChoice;dip=null;$('#ins').hidden=true};
addEventListener('appinstalled',()=>{$('#ins').hidden=true;toast('BitacObra instalada')});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
